# ============================================================
#  xiaofengzhulin.xyz 站点配置
#  放置位置：/etc/nginx/conf.d/xiaofengzhulin.conf
#
#  作用：
#    1) 80 -> 443 强制跳转（并放行 Let's Encrypt 校验目录）
#    2) 443 提供静态首页（公安备案审核人员必须能打开 -> 关键）
#    3) /api/ 反向代理到本机 3000 端口的代理服务（server/server.js）
#    4) 登录接口在边缘做一层粗粒度限流
#
#  依赖：nginx、/etc/nginx/cert/ 下的证书、/var/www/xiaofengzhulin 下的站点文件
#  校验：sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# 登录接口限流：应用内才是精确的（单 IP 20 次/分钟、单学号 5 次/分钟），
# 这里是"挡洪水"的粗闸，防止脚本连点把 Node 进程拖垮。
# 若不需要，删掉这两行和下方 location = /api/login 即可。
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name xiaofengzhulin.xyz www.xiaofengzhulin.xyz;

    # 申请/续期证书时的校验目录（阿里云免费证书走 DNS 校验时可忽略）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # 使用经典的 listen ... http2 写法：nginx 1.24 / 1.25+ 都能用
    # （较新的 http2 独立指令只有 1.25.1+ 支持，写在这里会让老版本 nginx -t 直接失败）
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name xiaofengzhulin.xyz www.xiaofengzhulin.xyz;

    # ↓↓↓ 这两行会被 deploy_server.py 替换成服务器上真实的证书路径
    ssl_certificate     /etc/nginx/cert/xiaofengzhulin.xyz.pem;
    ssl_certificate_key /etc/nginx/cert/xiaofengzhulin.xyz.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    charset utf-8;
    gzip             on;
    gzip_min_length  1k;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;

    root  /var/www/xiaofengzhulin;
    index index.html;

    # 静态首页：备案审核访问的就是这里
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源缓存 7 天（index.html 不在其中，改备案号后可立即生效）
    location ~* \.(css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
        expires 7d;
    }

    # 登录接口：边缘粗粒度限流（应用内才是精确的：单 IP 20 次/分钟、单学号 5 次/分钟）
    location = /api/login {
        limit_req          zone=login_limit burst=20 nodelay;
        limit_req_status   429;
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # 小程序调用的后端接口：POST /api/login、GET /api/health
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # 登录教务系统并抓取全部成绩较慢，给足超时
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location = /favicon.ico { log_not_found off; access_log off; }

    access_log /var/log/nginx/xiaofengzhulin.access.log;
    error_log  /var/log/nginx/xiaofengzhulin.error.log;
}
